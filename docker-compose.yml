services:
  postgres-app:
    image: postgres:16-alpine
    container_name: service-postgres-app
    environment:
      POSTGRES_DB: recipedb
      POSTGRES_USER: recipeuser
      POSTGRES_PASSWORD: recipepass
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipeuser -d recipedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recipe-network

  minio:
    image: minio/minio:latest
    container_name: service-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recipe-network


volumes:
  postgres_app_data:
  minio_data:

networks:
  recipe-network:
    driver: bridge