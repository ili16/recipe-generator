services:
  postgres-app:
    image: postgres:16-alpine
    container_name: service-postgres-app
    environment:
      POSTGRES_DB: recipedb
      POSTGRES_USER: recipeuser
      POSTGRES_PASSWORD: recipepass
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipeuser -d recipedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recipe-network

volumes:
  postgres_app_data:

networks:
  recipe-network:
    driver: bridge